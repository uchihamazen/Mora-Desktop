<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniShop</title>
<style>body{font:18px system-ui;max-width:800px;margin:3rem auto;padding:1rem;background:#f4f2eb;color:#163348}label{display:block;margin:1rem 0}input,select,button{font:inherit;padding:.6rem;margin:.3rem}#products{display:flex;flex-wrap:wrap}#total{display:block;margin:2rem 0;font-weight:700}</style>
<h1>MiniShop</h1><label>Search products <input id="search" type="search"></label><section id="products" aria-label="Products"></section>
<label>Coupon <input id="coupon"></label><label>Delivery area <select id="zone"><option>Cairo</option><option>Alexandria</option><option>Other</option></select></label>
<output id="total" role="status" aria-label="Total"></output><script type="module" src="app.js"></script></html>
