name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem artifacts/release/Muse-Desktop-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -LiteralPath "$($_.FullName).sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v7
        with:
          name: Muse-Desktop-Windows-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            artifacts/release/Muse-Desktop-Setup-*.exe
            artifacts/release/Muse-Desktop-Setup-*.exe.sha256
