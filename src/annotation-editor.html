<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';"><title>Annotation note</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#171b22;color:#eef1f7;font:14px Segoe UI,sans-serif;height:100vh;display:flex;flex-direction:column;gap:9px;border:1px solid #475569;border-radius:8px}header{font-weight:600}small{color:#9da7b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}textarea{flex:1;min-height:60px;resize:none;border:1px solid #536078;border-radius:6px;background:#10141b;color:inherit;padding:10px;font:inherit}textarea:focus{outline:2px solid #4ba5ff;outline-offset:1px}footer{display:flex;gap:8px;justify-content:flex-end}button{font:inherit;padding:6px 12px;border:1px solid #536078;border-radius:6px;background:#252c38;color:inherit;cursor:pointer}#save{background:#1678e7;border-color:#3698ff}#error{color:#ffaca9;font-size:12px;margin:0;min-height:16px}[hidden]{display:none!important}
